name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, cmake_args: "-A x64", artifact: PlateMask-windows-x64 }
          - { name: macos-universal, os: macos-latest, cmake_args: "", artifact: PlateMask-macos-universal }
          - { name: linux-x64, os: ubuntu-latest, cmake_args: "", artifact: PlateMask-linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test (core + plugin binary through the mini host)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Show bundle
        shell: bash
        run: find build/PlateMask.ofx.bundle -type f -exec ls -la {} \;
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/PlateMask.ofx.bundle
          if-no-files-found: error

  release:
    name: attach release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          for p in windows-x64 linux-x64 macos-universal; do
            d="PlateMask-$V-$p"; mkdir -p "$d"
            cp -R "artifacts/PlateMask-$p" "$d/PlateMask.ofx.bundle"
            cp README.md "$d/"
            case "$p" in
              windows-x64) cp packaging/install.bat packaging/uninstall.bat "$d/" ;;
              *) cp packaging/install.sh packaging/uninstall.sh "$d/"; chmod +x "$d"/*.sh ;;
            esac
            zip -qry "$d.zip" "$d"
          done
          ls -la *.zip
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" PlateMask-*.zip --clobber --repo "$GITHUB_REPOSITORY"
